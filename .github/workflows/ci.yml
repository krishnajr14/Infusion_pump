name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build libgtest-dev

      - name: Configure
        run: cmake -S . -B build-ci -G Ninja

      - name: Build
        run: cmake --build build-ci --parallel

      - name: Run unit tests
        run: ctest --test-dir build-ci --output-on-failure

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build libgtest-dev lcov

      - name: Configure with coverage
        run: cmake -S . -B build-coverage -G Ninja -DENABLE_COVERAGE=ON

      - name: Generate coverage report
        run: cmake --build build-coverage --target coverage --parallel

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build-coverage/coverage_html
          if-no-files-found: error
